<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heater</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f8; --card: #ffffff; --ink: #161a23; --muted: #626a7c; --line: #e1e4ec;
    --accent: #6c4cff; --on: #178a50; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d12; --card: #151924; --ink: #e8ebf3; --muted: #8b93a7; --line: #232837;
            --accent: #8b74ff; --on: #2ccf83; --err: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
       margin: 28px 0 10px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  #today { font-weight: 600; }
  #today.holiday { border-color: var(--on); color: var(--on); }
  button, input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
                  border-radius: 9px; padding: 8px 12px; min-width: 0; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
  .wide { grid-column: 1 / -1; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  li small { display: block; color: var(--muted); overflow-wrap: anywhere; }
  li.active { border-color: var(--on); }
  .past li { opacity: .6; }
  .empty { color: var(--muted); }
  #err, #powerMsg.bad { color: var(--err); }
  #err { margin: 12px 0; }
  /* The chart copies the LCD: black on white over blue-to-red columns, in both themes. */
  .lcd { background: #fff; color: #000; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  #reading { font-size: 22px; font-weight: 600; padding: 8px 14px; font-variant-numeric: tabular-nums; }
  #chart { display: block; width: 100%; height: 180px; touch-action: pan-y; }
  .axis { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .power { display: flex; gap: 8px; flex-wrap: wrap; }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  #powerMsg { margin: 10px 0 0; }
  #powerMsg:empty { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Heater</h1>
  <div id="today" class="card">Loading…</div>
  <div id="err" role="alert" hidden></div>

  <h2>Temperature</h2>
  <div class="lcd">
    <div id="reading">Waiting for readings…</div>
    <canvas id="chart" role="img" aria-label="Recent temperature"></canvas>
  </div>
  <div class="axis"><span id="first"></span><span id="extent"></span><span id="last"></span></div>

  <h2>Add a holiday</h2>
  <div class="card">
    <div class="quick">
      <button type="button" id="addToday">Add today</button>
      <button type="button" id="addTomorrow">Add tomorrow</button>
    </div>
    <form id="form">
      <label>First day <input type="date" id="from" required></label>
      <label>Last day <input type="date" id="to"></label>
      <label class="wide">Note (optional) <input type="text" id="note" maxlength="100"></label>
      <button class="primary wide" type="submit">Add holiday</button>
    </form>
  </div>

  <h2>Current and upcoming</h2>
  <ul id="upcoming"></ul>

  <div id="pastBlock" hidden>
    <h2>Past</h2>
    <ul id="past" class="past"></ul>
  </div>

  <h2>Raspberry Pi</h2>
  <div class="card">
    <div class="power">
      <button type="button" id="restart" class="danger">Restart</button>
      <button type="button" id="shutdown" class="danger">Shut down</button>
    </div>
    <p id="powerMsg" role="status"></p>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let state = null;

const parse = (iso) => new Date(iso + "T00:00:00Z");
const nice = (iso) => parse(iso).toLocaleDateString("en-GB",
  { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const nextDay = (iso) => new Date(parse(iso).getTime() + 86400000).toISOString().slice(0, 10);
const range = (h) => h.from === h.to ? nice(h.from) : `${nice(h.from)} to ${nice(h.to)}`;

function showError(message) { $("#err").textContent = message; $("#err").hidden = !message; }

async function api(path, body) {
  let r;
  try {
    r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  } catch { throw new Error("Can't reach the Pi"); }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

function item(h) {
  const li = document.createElement("li");
  li.className = "card" + (h.from <= state.today && state.today <= h.to ? " active" : "");
  const text = document.createElement("div");
  text.textContent = range(h);
  if (h.note) { const s = document.createElement("small"); s.textContent = h.note; text.appendChild(s); }
  const del = document.createElement("button");
  del.textContent = "Delete";
  del.setAttribute("aria-label", "Delete " + range(h));
  del.onclick = () => {
    if (confirm(`Delete ${range(h)}?`)) send("/api/delete", { id: h.id });
  };
  li.append(text, del);
  return li;
}

function render() {
  const today = $("#today");
  today.classList.toggle("holiday", state.on_holiday);
  today.textContent = `${nice(state.today)}: ` + (state.on_holiday
    ? "on holiday, the heater will not switch on automatically."
    : "no holiday set, the normal schedule applies.");
  const upcoming = state.holidays.filter(h => h.to >= state.today);
  const past = state.holidays.filter(h => h.to < state.today).reverse();
  $("#upcoming").replaceChildren(...upcoming.map(item));
  if (!upcoming.length) {
    const li = document.createElement("li"); li.className = "empty"; li.textContent = "None planned.";
    $("#upcoming").appendChild(li);
  }
  $("#past").replaceChildren(...past.map(item));
  $("#pastBlock").hidden = !past.length;
}

async function send(path, body) {
  try { state = await api(path, body); showError(""); render(); return true; }
  catch (e) { showError(e.message); return false; }
}

async function refresh() {
  try {
    const s = await api("/api/state");
    const changed = JSON.stringify(s) !== JSON.stringify(state);
    state = s; showError("");
    if (changed) render();
  } catch (e) { showError(e.message); }
}

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  if (await send("/api/add", { from: $("#from").value, to: $("#to").value, note: $("#note").value })) e.target.reset();
};
function quick(day) {
  if (state.holidays.some(h => h.from <= day && day <= h.to)) return showError(`${nice(day)} is already a holiday.`);
  send("/api/add", { from: day });
}
$("#addToday").onclick = () => state && quick(state.today);
$("#addTomorrow").onclick = () => state && quick(nextDay(state.today));
$("#from").onchange = () => { $("#to").min = $("#from").value; };
$("#form").onreset = () => { $("#to").min = ""; };

let samples = [];
let hover = null;   // index of the reading under the pointer

const clock = (t) => new Date(t * 1000).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

// Same scaling and colours as EnviroWrapper.display_text on the LCD.
function drawChart() {
  const c = $("#chart"), g = c.getContext("2d"), ratio = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  c.width = W * ratio; c.height = H * ratio; g.scale(ratio, ratio);
  if (!samples.length) return;
  const values = samples.map(s => s.c), min = Math.min(...values), max = Math.max(...values);
  const step = W / samples.length;
  const level = values.map(v => (v - min + 1) / (max - min + 1));
  level.forEach((l, i) => {
    const x = Math.floor(i * step), w = Math.floor((i + 1) * step) - x;
    g.fillStyle = `hsl(${(1 - l) * 216}, 100%, 50%)`;
    g.fillRect(x, 0, w, H);
    g.fillStyle = "#000";
    g.fillRect(x, Math.min(H - l * H, H - 2), w, 2);
  });
  if (hover !== null) { g.fillStyle = "#000"; g.fillRect((hover + 0.5) * step - 0.5, 0, 1, H); }
  const shown = samples[hover === null ? samples.length - 1 : hover];
  $("#reading").textContent = `temp: ${shown.c.toFixed(1)} °C` + (hover === null ? "" : ` at ${clock(shown.t)}`);
  $("#first").textContent = clock(samples[0].t);
  $("#last").textContent = clock(samples[samples.length - 1].t);
  $("#extent").textContent = `low ${min.toFixed(1)} °C, high ${max.toFixed(1)} °C`;
  c.setAttribute("aria-label", `Temperature from ${$("#first").textContent} to ${$("#last").textContent}, ${$("#extent").textContent}`);
}

async function refreshChart() {
  try { samples = (await api("/api/temperature")).samples; } catch { return; }
  if (hover !== null && hover >= samples.length) hover = null;
  drawChart();
}

function point(e) {
  if (!samples.length) return;
  const box = $("#chart").getBoundingClientRect();
  hover = Math.max(0, Math.min(samples.length - 1, Math.floor((e.clientX - box.left) / box.width * samples.length)));
  drawChart();
}
$("#chart").onpointermove = point;
$("#chart").onpointerdown = point;
$("#chart").onpointerleave = () => { hover = null; drawChart(); };
window.addEventListener("resize", drawChart);

function powerMessage(text, bad) {
  $("#powerMsg").textContent = text;
  $("#powerMsg").classList.toggle("bad", !!bad);
}
const powerButtons = (disabled) => { $("#restart").disabled = $("#shutdown").disabled = disabled; };

async function power(action, force) {
  powerButtons(true);
  powerMessage("Switching the heater off…");
  let r, data;
  try {
    r = await fetch("/api/power", { method: "POST", headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ action, force }) });
    data = await r.json();
  } catch {
    powerButtons(false);
    return powerMessage("No reply from the Pi, so check whether it worked.", true);
  }
  if (r.ok) {
    powerMessage(action === "restart"
      ? "Restarting. This page will reconnect in a few minutes."
      : "Shutting down. To start the Pi again, unplug it and plug it back in.");
    return setTimeout(() => powerButtons(false), 60000);
  }
  powerButtons(false);
  powerMessage(data.error, true);
  if (data.heater === false && confirm("Couldn't switch the heater off, so it may stay on with nothing controlling it. Check it. Carry on anyway?")) {
    power(action, true);
  }
}
$("#restart").onclick = () => {
  if (confirm("Restart the Pi? Heater control stops until it is back.")) power("restart");
};
$("#shutdown").onclick = () => {
  if (confirm("Shut down the Pi? Heater control stops, and you can only start it again by unplugging it and plugging it back in.")) power("shutdown");
};

refresh();
refreshChart();
setInterval(refresh, 30000);
setInterval(refreshChart, 30000);
</script>
</body>
</html>
